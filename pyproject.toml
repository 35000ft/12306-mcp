[project]
name = "next-train-mcp-server"
version = "0.1.0"
description = "MCP服务器用于12306车票查询"
authors = [
    { name = "yunshang", email = "above35000ft@foxmail.com" }
]
dynamic = ["readme"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "mcp>=1.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pytz>=2025.2",
    "playwright~=1.42.0",
    "playwright-stealth~=1.0.5",
    "loguru>=0.7.3",
    "fastapi-cache2>=0.2.2",
    "china-railway-tools",
    "fastmcp>=2.9.2",
    "json5>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.26.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.26.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]


[tool.uv.sources]
china-railway-tools = { git = "https://github.com/35000ft/china-railway-tools.git" }

[project.scripts]
mcp-12306 = "next_train_mcp.server:main"

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
